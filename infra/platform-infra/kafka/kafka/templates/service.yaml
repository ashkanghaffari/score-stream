apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "kafka.name" . }}

  ports:
    - name: broker
      port: 9092
      targetPort: 9092

    - name: controller
      port: 9093
      targetPort: 9093
