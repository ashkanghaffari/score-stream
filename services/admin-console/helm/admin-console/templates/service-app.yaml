apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin-console.fullname" . }}
  labels:
    {{- include "admin-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.app.type }}
  selector:
    {{- include "admin-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: app
      port: {{ .Values.service.app.port }}
      targetPort: app
      protocol: TCP
