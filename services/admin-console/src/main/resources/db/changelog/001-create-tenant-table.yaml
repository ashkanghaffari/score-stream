databaseChangeLog:
  - changeSet:
      id: 1
      author: Ashkan Ghaffari
      changes:
        - createTable:
            tableName: tenant
            columns:
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenant
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: BIGINT
                  constraints:
                    nullable: true
