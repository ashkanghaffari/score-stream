databaseChangeLog:
  - changeSet:
      id: 4
      author: Ashkan Ghaffari
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_token_hash
                    nullable: false

              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: issued_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: tenant_id, user_id
            referencedTableName: tenant_user
            referencedColumnNames: tenant_id, user_id
            constraintName: fk_refresh_token_tenant_user
            onDelete: CASCADE

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_tenant_user
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: user_id
