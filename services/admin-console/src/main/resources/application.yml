spring:
  application:
    name: admin-console

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob.non_contextual_creation: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: ${ADMIN_SERVER_PORT}

management:
  server:
    port: ${ADMIN_MANAGEMENT_PORT}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

admin:
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer-uri: https://accounts.google.com
      scopes:
        - openid
        - email
        - profile
    jwt:
      secret: ${ADMIN_JWT_SECRET}
      issuer: admin-console
      access-token-lifetime-sec: ${ADMIN_JWT_ACCESS_LIFETIME_SEC}
      refresh-token-lifetime-days: ${ADMIN_JWT_REFRESH_LIFETIME_DAYS}
