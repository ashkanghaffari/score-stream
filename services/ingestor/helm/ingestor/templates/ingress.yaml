{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ingestor.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.appHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ingestor.fullname" . }}
                port:
                  number: {{ .Values.service.app.port }}

    - host: {{ .Values.ingress.managementHost }}
      http:
        paths:
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: {{ include "ingestor.fullname" . }}-management
                port:
                  number: {{ .Values.service.management.port }}
{{- end }}
