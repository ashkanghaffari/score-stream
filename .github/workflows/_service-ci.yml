name: service-ci

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      service:
        description: "Service directory name under services/"
        required: true
        type: string
      image_repo_override:
        description: "Optional full image repo (defaults to ghcr.io/<owner>/<service>)"
        required: false
        type: string
    secrets:
      gh_token:
        required: true

concurrency:
  group: ci-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      jar_artifact: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test (Maven reactor limited to this service)
        run: mvn -B -pl "services/${{ inputs.service }}" -am clean verify

      - name: Pick Spring Boot fat jar -> app.jar
        run: |
          set -euo pipefail
          shopt -s nullglob
          MODULE="services/${{ inputs.service }}"
          jars=("$MODULE"/target/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jars found in $MODULE/target — did the build fail?" >&2
            exit 1
          fi
          for f in "${jars[@]}"; do
            base="${f##*/}"
            case "$base" in
              original-*.jar|*-sources.jar|*-javadoc.jar|*-tests.jar|*-test.jar) continue ;;
            esac
            if unzip -p "$f" META-INF/MANIFEST.MF 2>/dev/null | \
               grep -Eq '^(Main-Class: org\.springframework\.boot\.loader(\.launch)?\.JarLauncher|Start-Class:)'; then
              cp -f "$f" "$MODULE/target/app.jar"
              echo "Picked fat jar: $f"
              exit 0
            fi
          done
          echo "ERROR: No Spring Boot fat jar found. Ensure spring-boot-maven-plugin runs repackage." >&2
          exit 1

      - name: Upload tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-tested-jar-${{ github.sha }}
          path: services/${{ inputs.service }}/target/app.jar

      - name: Expose artifact name
        id: meta
        run: echo "artifact_name=${{ inputs.service }}-tested-jar-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.DATE_SHA }}
      image_repo: ${{ steps.vars.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Download tested JAR (same run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test.outputs.jar_artifact }}
          path: services/${{ inputs.service }}/target

      - uses: docker/setup-buildx-action@v3

      - name: Set image repo
        id: vars
        env:
          DEF: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}
          OVERRIDE: ${{ inputs.image_repo_override }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "repo=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$DEF" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token }}

      - name: Compose tag
        id: tag
        run: |
          ts=$(date -u +'%Y%m%d-%H%M%S'); short=${GITHUB_SHA::7}
          echo "DATE_SHA=${ts}-${short}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ steps.tag.outputs.DATE_SHA }}
            ${{ startsWith(github.ref, 'refs/heads/development') && format('{0}:latest', steps.vars.outputs.repo) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upload-image-fragment:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Create fragment
        run: |
          mkdir -p manifests
          cat > manifests/${{ inputs.service }}.json <<JSON
          {
            "${{ inputs.service }}": {
              "repository": "${{ needs.docker-build.outputs.image_repo }}",
              "tag": "${{ needs.docker-build.outputs.image_tag }}"
            }
          }
          JSON
      - name: Upload fragment
        uses: actions/upload-artifact@v4
        with:
          name: images-fragment-${{ inputs.service }}-${{ github.sha }}
          path: manifests/${{ inputs.service }}.json
          overwrite: true
